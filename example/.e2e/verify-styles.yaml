# End-to-end style verification for react-native-css-nitro.
# Runs against the Release build on iPhone 17 Pro (iOS 26.5).
appId: cssnitro.example
---
- launchApp
- assertVisible:
    id: showcase-header
# container queries: wide frame green, narrow frame red
- assertVisible:
    id: cq-wide-label
- assertVisible:
    id: cq-narrow-label
- takeScreenshot: e2e-initial
# dark-mode class selectors: toggle the scheme, card must flip
- tapOn:
    id: dark-toggle
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: e2e-dark
- tapOn:
    id: dark-toggle
- waitForAnimationToEnd:
    timeout: 2000
